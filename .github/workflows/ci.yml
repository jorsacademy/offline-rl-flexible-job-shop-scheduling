name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m offline_fjsp.experiment
      - run: python -m offline_fjsp.phase3_experiment

  neural-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,neural]'
      - run: ruff check src tests
      - run: pytest -q tests/test_phase4.py tests/test_final_evaluation.py
      - run: python -m offline_fjsp.phase4_experiment
