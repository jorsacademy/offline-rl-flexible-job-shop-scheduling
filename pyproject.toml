[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-fjsp"
version = "0.3.0"
description = "Offline reinforcement learning research framework for flexible job shop scheduling"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
neural = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
